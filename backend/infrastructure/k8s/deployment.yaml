apiVersion: apps/v1
kind: Deployment
metadata:
  name: parakh-backend-deployment
  namespace: parakh
  labels:
    app: parakh-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: parakh-backend
  template:
    metadata:
      labels:
        app: parakh-backend
    spec:
      containers:
        - name: parakh-backend
          image: parakh-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: parakh-configmap
            - secretRef:
                name: parakh-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
