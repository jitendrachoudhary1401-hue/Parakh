apiVersion: v1
kind: Service
metadata:
  name: parakh-backend-service
  namespace: parakh
  labels:
    app: parakh-backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: parakh-backend
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: parakh-configmap
  namespace: parakh
data:
  APP_NAME: "PARAKH"
  APP_ENV: "production"
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  HOST: "0.0.0.0"
  PORT: "8000"
  WORKERS: "4"
  STORAGE_PROVIDER: "minio"
  MINIO_ENDPOINT_URL: "http://minio.parakh.svc.cluster.local:9000"
  MINIO_BUCKET: "parakh-production-evidence"
  MINIO_REGION: "us-east-1"
  RATE_LIMIT_LOGIN: "5/minute"
  RATE_LIMIT_UPLOAD: "20/minute"
  RATE_LIMIT_ANALYSIS: "10/minute"
  RATE_LIMIT_EVIDENCE: "10/minute"
  ALLOWED_FRONTEND_ORIGINS: "https://parakh.nic.in,https://admin.parakh.nic.in"
---
apiVersion: v1
kind: Secret
metadata:
  name: parakh-secrets
  namespace: parakh
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://parakh_admin:REPLACE_WITH_VAULT_SECRET@postgres.parakh.svc.cluster.local:5432/parakh_db"
  DATABASE_URL_SYNC: "postgresql://parakh_admin:REPLACE_WITH_VAULT_SECRET@postgres.parakh.svc.cluster.local:5432/parakh_db"
  MONGODB_URL: "mongodb://mongo.parakh.svc.cluster.local:27017"
  REDIS_URL: "redis://redis.parakh.svc.cluster.local:6379/0"
  JWT_SECRET_KEY: "REPLACE_WITH_SECURE_VAULT_GENERATED_64_CHAR_KEY"
  GOOGLE_CLOUD_VISION_KEY: "REPLACE_WITH_GCP_VISION_KEY"
  GS1_API_KEY: "REPLACE_WITH_GS1_INDIA_KEY"
  MINIO_ACCESS_KEY: "REPLACE_WITH_MINIO_ACCESS_KEY"
  MINIO_SECRET_KEY: "REPLACE_WITH_MINIO_SECRET_KEY"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: parakh-backend-hpa
  namespace: parakh
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: parakh-backend-deployment
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: parakh-backend-ingress
  namespace: parakh
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "30m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - api.parakh.nic.in
      secretName: parakh-api-tls
  rules:
    - host: api.parakh.nic.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: parakh-backend-service
                port:
                  number: 8000
