name: project_parakh_mobile
description: "Project PARAKH — Advanced Legal Metrology Compliance Mobile App for Enforcement Officials (DoCA)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  provider: ^6.1.2
  http: ^1.2.1
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  crypto: ^3.0.3
  uuid: ^4.4.0
  path_provider: ^2.1.3
  file_picker: ^8.0.3
  camera: ^0.12.0+2
  geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#031631"
    theme_color: "#031631"
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 48

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/logo.svg
    - assets/logo.png
